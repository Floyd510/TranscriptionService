<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תמלול</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#1b2430;--mute:#66707d;--line:#d9dfe7;--acc:#1f5eff;--accink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#19212b;--ink:#e8edf3;--mute:#97a2b0;--line:#2a3441;--acc:#6b95ff;--accink:#0b1220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:8px 0 4px}
p.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;margin-bottom:6px}
select,button,input[type=file]{font:inherit;width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{cursor:pointer;font-weight:600}
button.go{background:var(--acc);color:var(--accink);border-color:var(--acc);padding:13px;font-size:1.05rem}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
progress{width:100%;height:10px}
#status{color:var(--mute);margin:8px 0 0;min-height:1.6em}
#out{width:100%;min-height:220px;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;line-height:1.7;resize:vertical}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>תמלול אודיו ווידאו</h1>
<p class="sub">הכל רץ במכשיר שלך. הקבצים לא נשלחים לשום שרת.</p>

<div class="card">
  <label for="file">קובץ אודיו או וידאו</label>
  <input id="file" type="file" accept="audio/*,video/*">
</div>

<div class="card row">
  <div>
    <label for="lang">שפה</label>
    <select id="lang">
      <option value="">זיהוי אוטומטי</option>
      <option value="hebrew" selected>עברית</option>
      <option value="english">English</option>
      <option value="arabic">العربية</option>
      <option value="russian">Русский</option>
      <option value="spanish">Español</option>
      <option value="french">Français</option>
      <option value="german">Deutsch</option>
      <option value="italian">Italiano</option>
      <option value="portuguese">Português</option>
      <option value="turkish">Türkçe</option>
      <option value="ukrainian">Українська</option>
      <option value="persian">فارسی</option>
      <option value="chinese">中文</option>
      <option value="japanese">日本語</option>
      <option value="korean">한국어</option>
      <option value="hindi">हिन्दी</option>
    </select>
  </div>
  <div>
    <label for="model">איכות</label>
    <select id="model">
      <option value="onnx-community/whisper-tiny">מהירה (קטן)</option>
      <option value="onnx-community/whisper-base" selected>מאוזנת</option>
      <option value="onnx-community/whisper-small">מדויקת (איטית)</option>
    </select>
  </div>
</div>

<button id="go" class="go" disabled>בחר קובץ כדי להתחיל</button>
<progress id="bar" class="hide" max="100" value="0"></progress>
<p id="status" role="status"></p>

<div id="result" class="card hide">
  <label for="out">התמלול</label>
  <textarea id="out" dir="auto"></textarea>
  <div class="acts">
    <button id="copy">העתק</button>
    <button id="txt">הורד טקסט</button>
    <button id="srt">הורד כתוביות</button>
  </div>
</div>
</main>

<script type="module">
import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.1";

const $ = id => document.getElementById(id);
const fileEl = $("file"), go = $("go"), bar = $("bar"), status = $("status");
let asr = null, loadedModel = null, segments = [];

fileEl.addEventListener("change", () => {
  go.disabled = !fileEl.files[0];
  go.textContent = fileEl.files[0] ? "תמלל" : "בחר קובץ כדי להתחיל";
});

const setStatus = t => status.textContent = t;

async function decode(file) {
  const buf = await file.arrayBuffer();
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  const audio = await ctx.decodeAudioData(buf);
  ctx.close();
  if (audio.numberOfChannels === 1) return audio.getChannelData(0);
  const a = audio.getChannelData(0), b = audio.getChannelData(1);
  const mix = new Float32Array(a.length);
  for (let i = 0; i < a.length; i++) mix[i] = (a[i] + b[i]) / 2;
  return mix;
}

async function load(model) {
  if (asr && loadedModel === model) return;
  bar.classList.remove("hide"); bar.value = 0;
  setStatus("מוריד את המודל. בפעם הראשונה זה לוקח זמן, ובפעמים הבאות זה מיידי.");
  const opts = {
    dtype: "q8",
    progress_callback: p => {
      if (p.status === "progress") { bar.value = p.progress; setStatus("מוריד מודל… " + Math.round(p.progress) + "%"); }
    }
  };
  try {
    if (navigator.gpu) asr = await pipeline("automatic-speech-recognition", model, { ...opts, device: "webgpu", dtype: { encoder_model: "fp32", decoder_model_merged: "q4" } });
    else throw new Error("no gpu");
  } catch {
    asr = await pipeline("automatic-speech-recognition", model, { ...opts, device: "wasm" });
  }
  loadedModel = model;
}

const ts = (s, comma) => {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = Math.floor(s % 60), ms = Math.round((s % 1) * 1000);
  const p = (n, l = 2) => String(n).padStart(l, "0");
  return `${p(h)}:${p(m)}:${p(sec)}${comma ? "," : "."}${p(ms, 3)}`;
};

go.addEventListener("click", async () => {
  const file = fileEl.files[0]; if (!file) return;
  go.disabled = true; $("result").classList.add("hide");
  try {
    setStatus("קורא את הקובץ…");
    const audio = await decode(file);
    await load($("model").value);
    bar.removeAttribute("value");
    setStatus("מתמלל… זה יכול לקחת כמה דקות.");
    const lang = $("lang").value;
    const res = await asr(audio, {
      chunk_length_s: 30, stride_length_s: 5,
      return_timestamps: true,
      task: "transcribe",
      ...(lang ? { language: lang } : {})
    });
    segments = (res.chunks || []).map(c => ({ s: c.timestamp[0] ?? 0, e: c.timestamp[1] ?? c.timestamp[0] ?? 0, t: c.text.trim() })).filter(c => c.t);
    $("out").value = segments.length ? segments.map(c => c.t).join("\n") : res.text.trim();
    $("result").classList.remove("hide");
    setStatus("התמלול מוכן. אפשר לערוך אותו בתיבה.");
  } catch (e) {
    console.error(e);
    setStatus("שגיאה: " + (e.message || e) + ". נסה קובץ קצר יותר או איכות נמוכה יותר.");
  } finally {
    bar.classList.add("hide"); bar.value = 0; go.disabled = false;
  }
});

function save(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const base = () => (fileEl.files[0]?.name || "transcript").replace(/\.[^.]+$/, "");

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("out").value); setStatus("הועתק."); }
  catch { $("out").select(); document.execCommand("copy"); setStatus("הועתק."); }
};
$("txt").onclick = () => save(base() + ".txt", $("out").value, "text/plain;charset=utf-8");
$("srt").onclick = () => {
  if (!segments.length) { setStatus("אין חלוקה לזמנים בתמלול הזה."); return; }
  save(base() + ".srt", segments.map((c, i) => `${i + 1}\n${ts(c.s, true)} --> ${ts(c.e, true)}\n${c.t}\n`).join("\n"), "text/plain;charset=utf-8");
};
</script>
</body>
</html>
